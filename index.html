<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment: Sémantické hodnocení moci</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="intro-screen" class="screen">
        <div class="card shadow">
            <h1>Experiment</h1>
            <p>Zadejte prosím své identifikační číslo:</p>
            <input type="text" id="participant-id" placeholder="ID účastníka (např. 01)" autocomplete="off">
            <button id="start-btn">Vstoupit do experimentu</button>
        </div>
    </div>

    <div id="experiment-screen" class="screen hidden">
        <div class="main-layout">
            <div class="sidebar">
                <div class="instructions">
                    <h3>Slova k roztřídění</h3>
                    <p>Seřaďte slova k roztřídění na vertikální osu.</p>
                </div>
                <div class="words-bank" id="words-bank">
                    </div>
            </div>

            <div class="axis-area">
                <div class="axis-container">
                    <div class="axis-ticks" id="axis-ticks"></div>
                    
                    <div class="axis" id="axis">
                        <div class="axis-line"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <button id="finish-btn" class="hidden btn-save">Odeslat a uložit data</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
